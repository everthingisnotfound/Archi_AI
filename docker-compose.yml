services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-archaeologist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archaeologist}
      POSTGRES_USER: ${POSTGRES_USER:-archaeologist}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-archaeologist} -d ${POSTGRES_DB:-archaeologist}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-insecure-dev-only}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis-insecure-dev-only}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD:-redis-insecure-dev-only}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AI_SERVICE_URL: http://ai:8000
      CORS_ORIGIN: 'http://localhost:5173,http://localhost:8080'
    volumes:
      - workspace-data:/var/lib/archaeologist/workspaces
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/healthz').then(r=>{if(!r.ok) throw new Error(r.statusText)}).catch(e=>{console.error(e);process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "4000:4000"

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AI_SERVICE_URL: http://ai:8000
      CORS_ORIGIN: 'http://localhost:5173,http://localhost:8080'
      WORKSPACE_ROOT: /var/lib/archaeologist/workspaces
    volumes:
      - workspace-data:/var/lib/archaeologist/workspaces
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4100/healthz').then(r=>{if(!r.ok) throw new Error(r.statusText)}).catch(e=>{console.error(e);process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai:
    build:
      context: .
      dockerfile: infra/docker/ai.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AI_SERVICE_URL: http://localhost:8000
    volumes:
      - workspace-data:/var/lib/archaeologist/workspaces
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5173:80"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data:
  redis-data:
  workspace-data:
