[project]
name = "ai-software-archaeologist-ai"
version = "0.1.0"
description = "Python AI analysis service for AI Software Archaeologist"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "gitpython>=3.1.43",
  "networkx>=3.3",
  "openai>=1.50.0",
  "psycopg[binary]>=3.2.1",
  "pydantic-settings>=2.5.2",
  "structlog>=24.4.0",
  "tree-sitter>=0.23.0",
  "tree-sitter-languages>=1.10.2",
  "uvicorn[standard]>=0.30.6"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.2",
  "mypy>=1.11.2",
  "pytest>=8.3.3",
  "ruff>=0.6.8"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []

